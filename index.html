<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Nest - Reader &amp; Editor — Legal</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --text: #1c2024;
    --text-muted: #5b6470;
    --border: #e3e6ea;
    --accent: #2f6fed;
    --accent-contrast: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --surface: #1c1f24;
      --text: #eef0f2;
      --text-muted: #a3acb8;
      --border: #2a2e35;
      --accent: #6c9bff;
      --accent-contrast: #0c1220;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }
  .brand {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  h1 {
    font-size: 30px;
    margin: 0 0 12px;
    line-height: 1.25;
  }
  p.lead {
    color: var(--text-muted);
    font-size: 16px;
    margin: 0 0 40px;
  }
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    text-decoration: none;
    color: var(--text);
    font-weight: 600;
    font-size: 16px;
    transition: border-color 0.15s ease;
  }
  a.card:hover { border-color: var(--accent); }
  a.card .arrow { color: var(--accent); font-weight: 700; }
  footer {
    margin-top: 56px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 13px;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Khanh Thanh LTD</div>
    <h1>PDF Nest - Reader &amp; Editor</h1>
    <p class="lead">Legal and policy documents for the PDF Nest Android app.</p>

    <div class="card-list">
      <a class="card" href="privacy-policy/">Privacy Policy <span class="arrow">→</span></a>
      <a class="card" href="terms-of-use/">Terms of Use <span class="arrow">→</span></a>
    </div>

    <footer>
      &copy; 2026 Khanh Thanh LTD · Contact <a href="mailto:khanhthanhltd@gmail.com">khanhthanhltd@gmail.com</a>
    </footer>
  </div>
</body>
</html>
